<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2CB | Značkové oblečení</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigace -->
    <header class="header">
        <div class="logo">2CB</div>
        <div class="cart">CART (0)</div>
    </header>

    <!-- Hero Sekce (Hlavní fotka) -->
    <section class="hero">
        <!-- Placeholder obrázek ve stylu streetwear z Unsplash -->
        <img src="https://images.unsplash.com/photo-1511511450040-677116ff389e?q=80&w=2073&auto=format&fit=crop" alt="2CB Kolekce" class="hero-img">
    </section>

    <!-- Produkty -->
    <main class="shop-container">
        <!-- Produkt 1 -->
        <div class="product">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500&auto=format&fit=crop" alt="2CB Tričko Bílé">
            <div class="product-info">
                <h3>2CB T-SHIRT - WHITE</h3>
                <p>890 CZK</p>
            </div>
        </div>
        <!-- Produkt 2 -->
        <div class="product">
            <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=500&auto=format&fit=crop" alt="2CB Tričko Černé">
            <div class="product-info">
                <h3>2CB T-SHIRT - BLACK</h3>
                <p>890 CZK</p>
            </div>
        </div>
        <!-- Produkt 3 -->
        <div class="product">
            <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=500&auto=format&fit=crop" alt="2CB Tričko Šedé">
            <div class="product-info">
                <h3>2CB T-SHIRT - GREY</h3>
                <p>890 CZK</p>
            </div>
        </div>
        <!-- Produkt 4 -->
        <div class="product">
            <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=500&auto=format&fit=crop" alt="2CB Tričko Červené">
            <div class="product-info">
                <h3>2CB T-SHIRT - RED</h3>
                <p>890 CZK</p>
            </div>
        </div>
    </main>

    <!-- Patička -->
    <footer class="footer">
        <div class="footer-content">
            <h2>2CB</h2>
            <p>31 Senovážné nám.</p>
            <p>11:00 - 19:00 monday - sunday</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
